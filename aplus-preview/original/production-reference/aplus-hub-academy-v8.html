<style>

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}

.b,.b2{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}.b2{background:transparent;color:var(--ink);border-color:var(--bd)}.b.bad{background:var(--bad);border-color:var(--bad)}
.lk{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;padding:0 4px;font-weight:600}.lk.bad{color:var(--bad)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px}
table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--bd)}th{background:var(--baby);font-size:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.ch{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;height:240px}.ch p{margin:0 0 4px;font-weight:600}.ch div{height:195px}

.te{background:var(--baby);border-radius:8px;padding:7px 9px;margin:0 0 7px;font-size:13px}.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.tg7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.tc{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px;min-height:70px;min-width:0}.tc h4{margin:0 0 6px}.ms{background:var(--baby);border-radius:5px;padding:2px 4px;margin-top:3px;font-size:11px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wg th,.wg td{white-space:normal;vertical-align:top;min-width:105px}.wg td:first-child,.wg th:first-child{min-width:58px;white-space:nowrap}
.wk{background:var(--baby);border-left:3px solid var(--acc);border-radius:6px;padding:3px 6px;margin-bottom:3px;font-size:12px;cursor:pointer}.wk.c{opacity:.55;border-left-style:dashed}

.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.g2 h4{margin:8px 0 4px}
#sbn{display:none;position:sticky;top:0;z-index:30;background:var(--bad);color:#fff;padding:10px 14px;font-weight:600}#sbn .b{margin-left:8px}
</style></head><body>
<div id="app"><nav id="nv"></nav><main id="v"></main></div><div id="m"></div>
<script>
const $=s=>document.querySelector(s);
let db=null,LOCK='',RAW=null,LASTGOOD='',SAVEBAD='';
try{RAW=localStorage.getItem('aplus')}catch(e){LOCK='Browser storage is blocked or unavailable ('+(e&&e.message||e)+').'}
if(!LOCK&&RAW!==null&&RAW!==''&&RAW!=='null'){try{db=JSON.parse(RAW)}catch(e){db=null;LOCK='The saved data could not be read (it is not valid JSON).'}
 if(!LOCK){const okA=db&&typeof db=='object'&&!Array.isArray(db)&&['t','s','sub','l','sp','tp','tt','pr','pp','rc','re','rm'].every(k=>db[k]===undefined||Array.isArray(db[k]));if(!okA){db=null;LOCK='The saved data is not in the expected format.'}}}
const CUR0=[['EGP','Egyptian Pound'],['KWD','Kuwaiti Dinar'],['SAR','Saudi Riyal'],['QAR','Qatari Riyal'],['AED','UAE Dirham'],['BHD','Bahraini Dinar'],['OMR','Omani Rial'],['USD','US Dollar']].map(a=>({c:a[0],n:a[1]}));
db=db||{t:[],s:[],sub:[],l:[],sp:[],tp:[],set:{name:'A+ Hub Academy',tr:'10',sr:'15'},id:1};
/* ---- non-destructive migration: only ADDS fields; legacy records were entered in KWD ---- */
(function(){['t','s','sub','l','sp','tp','tt','pr','pp','rc','re','rm'].forEach(k=>db[k]=db[k]||[]);db.rd=db.rd||{};db.rates=db.rates||{};db.cur=db.cur||CUR0;
if(!db.v){const had=db.l.length||db.sp.length||db.tp.length||db.t.length||db.s.length;db.set.base=had?'KWD':'EGP';
db.t.forEach(t=>t.cur=t.cur||'KWD');db.s.forEach(s=>s.cur=s.cur||'KWD');
db.l.forEach(l=>{if(l.bcost!=null)return;l.tc=l.sc=l.bc='KWD';l.trx=l.srx=1;l.rt='Legacy';l.lv=l.lv||'';l.bcost=Math.round(l.d*l.tr);l.bchg=Math.round(l.d*l.sr)});
[...db.sp,...db.tp].forEach(p=>{if(p.bamt!=null)return;p.cur='KWD';p.rx=1;p.bamt=p.amt;p.bc='KWD';p.rt='Legacy'});db.v=2}
if(db.v<3){db.sub.forEach(z=>{z.type=z.type||'Live'});
const mk=(r,t,n)=>{if(r.subj&&db.sub.some(z=>z.id==r.subj))return;const z={id:db.id++,name:n,type:t};db.sub.push(z);r.subj=z.id};
db.rc.forEach(c=>mk(c,'Recorded',c.name));db.pr.forEach(p=>mk(p,'Project',p.name));db.v=3}
if(db.v<5){db.sub.forEach(z=>{z.uni=z.uni||'';if((z.type||'Live')!='Live')return;const ls=db.l.filter(l=>l.sub==z.id);
 if(!Array.isArray(z.studs))z.studs=[...new Set(ls.map(l=>l.s))];
 if(!z.inst){const ts=[...new Set(ls.map(l=>l.t))];if(ts.length==1)z.inst=ts[0]}});db.v=5}
db.set.base=db.set.base||'EGP'})();
if(!LOCK)LASTGOOD=JSON.stringify(db);
const save=()=>{if(LOCK)return false;
 try{const s=JSON.stringify(db);localStorage.setItem('aplus',s);if(localStorage.getItem('aplus')!==s)throw new Error('the browser did not keep the data');LASTGOOD=s;if(SAVEBAD){SAVEBAD='';sbn()}return true}
 catch(e){SAVEBAD='The browser refused the save ('+(e&&e.message||e)+').';try{db=JSON.parse(LASTGOOD)}catch(x){}sbn();toast('NOT SAVED — the change was undone. See the red message at the top.',1);return false}};
const today=()=>new Date().toISOString().slice(0,10);
const V={nav:'Dashboard',tid:null,sid:null,prid:null,rcid:null,F:{},LF:{},tq:'',sq:'',TT:{m:'weekly',d:today()},RP:{p:'monthly',d:today(),a:'',b:'',f:{}},CF:{m:today().slice(0,7),cur:'',wt:'',s:'',t:'',meth:''}};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const g=(a,id)=>a.find(x=>x.id==id),tn=id=>g(db.t,id)?.name||'—',sn=id=>g(db.s,id)?.name||'—',bn=id=>g(db.sub,id)?.name||'—';
const m=x=>Math.round((parseFloat(x)||0)*1000),n3=n=>(n/1000).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
const B=()=>db.set.base,f=n=>n3(n)+' '+B(),fm=(n,c)=>n3(n)+' '+c;
const cl=n=>n<0?'neg':'pos',pc=(p,r)=>r?(p/r*100).toFixed(1)+'%':'0.0%',h2=h=>(+h).toFixed(2);
const addD=(d,n)=>new Date(+new Date(d+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],dow=d=>DAYS[new Date(d+'T00:00:00Z').getUTCDay()];
const LV=[['','—'],['High School','High School'],['Undergraduate','Undergraduate'],['Postgraduate','Postgraduate']],WT=['Live','Project','Recorded'],ST=['Completed','Cancelled','Rescheduled','No Show'];
const WTO=[['Live','Live'],['Project','Project'],['Recorded','Recorded Course']],wl=x=>x=='Recorded'?'Recorded Course':x;
/* ---- currency ---- */
const rate=c=>c==B()?{r:1,type:'Same'}:(db.rates[c]&&db.rates[c].r>0?db.rates[c]:null);
const rfor=c=>{const r=rate(c);return r?r.r:''};
const rty=(c,r,keep)=>c==B()?'Same':keep||(rate(c)&&rate(c).r==r?rate(c).type:'Manual');
const ty=(a,b)=>a=='Manual'||b=='Manual'?'Manual':a=='Live'||b=='Live'?'Live':a=='Legacy'||b=='Legacy'?'Legacy':'Same';
const curO=()=>db.cur.map(c=>[c.c,c.c+' — '+c.n]);
const mixed=()=>[...db.l,...db.pr,...db.rc].some(x=>x.bc&&x.bc!=B());
/* display conversion of a base-currency amount into another currency (current rate; never invented) */
const conv=(n,c)=>{if(c==B())return n;const r=rate(c);return r?Math.round(n/r.r):null};
const fx=(n,c)=>{const v=conv(n,c);return v==null?`<span class=neg>${c} rate unavailable</span>`:fm(v,c)};
const dp=(t,n)=>`<div class=cd style="grid-column:span 2"><span>${t}</span><b>${fx(n,'EGP')}</b><div class=mut style="font-weight:600;margin-top:2px">≈ ${fx(n,'KWD')}</div></div>`;
const VC=()=>[...new Set([B(),'EGP','KWD'])];
/* ---- core calculations ---- */
const O=l=>({cost:l.oc!=null?l.oc:Math.round(l.d*l.tr),chg:l.og!=null?l.og:Math.round(l.d*l.sr)}); /* original-currency amounts */
const C=l=>{const ok=l.st==='Completed',cost=ok?l.bcost:0,chg=ok?l.bchg:0;return{cost,chg,p:chg-cost}}; /* base-currency amounts */
const S=ls=>{const r={n:0,h:0,rev:0,cost:0};ls.forEach(l=>{if(l.st!=='Completed')return;const c=C(l);r.n++;r.h+=l.d;r.rev+=c.chg;r.cost+=c.cost});r.p=r.rev-r.cost;return r};
const sum=a=>a.reduce((x,p)=>x+p.bamt,0),sumO=a=>a.reduce((x,p)=>x+p.amt,0);
const TS=id=>{const s=S(db.l.filter(l=>l.t==id)),paid=sum(db.tp.filter(p=>p.p==id));return{...s,paid,rem:s.cost-paid}};
const SS=id=>{const s=S(db.l.filter(l=>l.s==id)),paidL=sum(db.sp.filter(p=>p.p==id));
let rcC=0,rcP=0;db.re.filter(e=>e.s==id).forEach(e=>{const c=g(db.rc,e.rc);if(!c)return;rcC+=k_(e.price,c.rx);rcP+=k_(e.paid,c.rx)});
let prC=0,prP=0;db.pr.filter(p=>p.s==id&&p.status!='Cancelled').forEach(p=>{const j=pj(p);prC+=j.brev;prP+=k_(j.paid,p.rx)});
const tot=s.rev+rcC+prC,paid=paidL+rcP+prP;return{...s,tot,paid,rem:tot-paid,paidL,rcC,rcP,prC,prP}};
const k_=(a,r)=>Math.round(a*r);
function pj(p){const share=Math.round(p.rev*p.share/100),paid=(p.paid0||0)+sumO(db.pp.filter(x=>x.pr==p.id));return{share,prof:p.rev-share,paid,out:p.rev-paid,brev:k_(p.rev,p.rx),bshare:k_(share,p.rx),bprof:k_(p.rev,p.rx)-k_(share,p.rx)}}
function rcc(c){const rev=Math.round(c.price*c.n),share=Math.round(rev*c.share/100),prof=rev-share-c.cost;return{rev,share,prof,brev:k_(rev,c.rx),bshare:k_(share,c.rx),bcost:k_(c.cost,c.rx),bprof:k_(rev,c.rx)-k_(share,c.rx)-k_(c.cost,c.rx)}}
const inD=(F,d)=>(!F.a||(d||'')>=F.a)&&(!F.b||(d||'')<=F.b);
function FL(F){const w=F.wt;
const ls=(w&&w!='Live')?[]:db.l.filter(l=>inD(F,l.date)&&(!F.t||l.t==F.t)&&(!F.s||l.s==F.s)&&(!F.lv||l.lv==F.lv)&&(!F.cur||l.tc==F.cur||l.sc==F.cur)&&(!F.sub||l.sub==F.sub)&&(!F.st||l.st==F.st)&&(!F.q||(tn(l.t)+sn(l.s)+bn(l.sub)).toLowerCase().includes(F.q.toLowerCase())));
const pr=(w&&w!='Project')||F.st?[]:db.pr.filter(p=>p.status!='Cancelled'&&(!F.sub||p.subj==F.sub)&&inD(F,p.start)&&(!F.t||p.t==F.t)&&(!F.s||p.s==F.s)&&(!F.lv||p.lv==F.lv)&&(!F.cur||p.cur==F.cur));
const rc=(w&&w!='Recorded')||F.st?[]:db.rc.filter(c=>(!F.sub||c.subj==F.sub)&&inD(F,c.date)&&(!F.t||c.inst==F.t)&&(!F.lv||c.lv==F.lv)&&(!F.cur||c.cur==F.cur)&&(!F.s||db.re.some(e=>e.rc==c.id&&e.s==F.s)));
return{ls,pr,rc}}
function TOT(x){const s=S(x.ls),L={rev:s.rev,cost:s.cost,p:s.p},P={rev:0,cost:0,p:0},R={rev:0,cost:0,p:0};
x.pr.forEach(p=>{const j=pj(p);P.rev+=j.brev;P.cost+=j.bshare;P.p+=j.bprof});x.rc.forEach(c=>{const j=rcc(c);R.rev+=j.brev;R.cost+=j.bshare+j.bcost;R.p+=j.bprof});
return{s,L,P,R,rev:L.rev+P.rev+R.rev,cost:L.cost+P.cost+R.cost,p:L.p+P.p+R.p}}
function EV(x){const e=[];x.ls.forEach(l=>{if(l.st!='Completed')return;const c=C(l);e.push({d:l.date,t:l.t,s:l.s,lv:l.lv,wt:'Live',rev:c.chg,cost:c.cost,p:c.p})});
x.pr.forEach(p=>{const j=pj(p);e.push({d:p.start||'',t:p.t,s:p.s,lv:p.lv,wt:'Project',rev:j.brev,cost:j.bshare,p:j.bprof})});
x.rc.forEach(c=>{const j=rcc(c);e.push({d:c.date||'',t:c.inst,s:0,lv:c.lv,wt:'Recorded',rev:j.brev,cost:j.bshare+j.bcost,p:j.bprof})});return e}
const gE=(e,kf,vf)=>{const o={};e.forEach(v=>{const k=kf(v)||'—';o[k]=(o[k]||0)+vf(v)});const k=Object.keys(o).sort();return[k,k.map(x=>o[x]/1000)]};
/* ---- ui helpers ---- */
const T=(h,rows,e)=>rows.length?`<div class=tw><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<p class=mut>${e||'Nothing here yet — use the Add button.'}</p>`;
const card=(l,v,c)=>`<div class=cd><span>${l}</span><b class="${c||''}">${v}</b></div>`;
const fi=(o,k,t,ph)=>`<input id=${o}_${k} type=${t} placeholder="${ph||''}" title="${ph||''}" value="${E(V[o][k]||'')}" oninput="V.${o}.${k}=this.value;render()">`;
const fs=(o,k,opts,all)=>`<select id=${o}_${k} onchange="V.${o}.${k}=this.value;render()"><option value="">${all}</option>${opts.map(x=>`<option value="${E(x[0])}" ${x[0]==V[o][k]?'selected':''}>${E(x[1])}</option>`).join('')}</select>`;
const fr=(k,t,ph)=>`<input id=RPf_${k} type=${t} placeholder="${ph}" value="${E(V.RP.f[k]||'')}" oninput="V.RP.f.${k}=this.value;render()">`;
const fsr=(k,opts,all)=>`<select id=RPf_${k} onchange="V.RP.f.${k}=this.value;render()"><option value="">${all}</option>${opts.map(x=>`<option value="${E(x[0])}" ${x[0]==V.RP.f[k]?'selected':''}>${E(x[1])}</option>`).join('')}</select>`;
const tO=()=>db.t.map(x=>[x.id,x.name]),sO=()=>db.s.map(x=>[x.id,x.name]),bO=()=>db.sub.map(x=>[x.id,x.name+(x.type&&x.type!='Live'?' ('+wl(x.type)+')':'')]),lvF=LV.slice(1),cF=()=>db.cur.map(c=>[c.c,c.c]);
const close=()=>$('#m').innerHTML='';
const modal=h=>$('#m').innerHTML=`<div class=mb><div class=md id=md>${h}</div></div>`;
function ask(msg,cb,lbl){if(SAVEBAD&&!storageOK())return note('Saving is failing right now, so this change would be lost. Download a backup and free up browser storage first.');modal(`<p>${msg}</p><div class=r><button class=b2 onclick=close()>Cancel</button><button class="b bad" id=yes>${lbl||'Delete'}</button></div>`);$('#yes').onclick=()=>{close();cb()}}
const note=h=>modal(`<p>${h}</p><div class=r><button class=b onclick=close()>OK</button></div>`);
function form(title,fl,v,sv,pv){v=v||{};if(SAVEBAD&&!storageOK())return note('Saving is failing right now, so this change would be lost. Download a backup and free up browser storage first.');
modal(`<h3 style="margin-top:0">${title}</h3><div class=fg>${fl.map(x=>`<label class="${x.w?'w':''}" ${x.v?`data-v="${x.v}"`:''}>${x.l}${x.t=='area'?`<textarea id=f_${x.k}>${E(v[x.k])}</textarea>`:(x.t=='sel'||x.t=='multi')?`${x.q?'<input class=qs placeholder="Type to search…" oninput="qf(this)">':''}<select id=f_${x.k} ${x.t=='multi'?'multiple size=5':''}>${x.o.map(o=>`<option value="${E(o[0])}" ${(x.t=='multi'?String(v[x.k]??'').split(',').includes(String(o[0])):o[0]==v[x.k])?'selected':''}>${E(o[1])}</option>`).join('')}</select>`:`<input id=f_${x.k} type=${x.t||'text'} ${x.t=='number'?'step=any min=0':''} ${x.d?'list='+x.d:''} value="${E(v[x.k])}">`}</label>`).join('')}</div>${pv?'<div id=pv class=pv></div>':''}<div id=er></div><div class=r><button class=b2 onclick=close()>Cancel</button><button class=b id=sv>Save</button></div>`);
const get=()=>Object.fromEntries(fl.map(x=>[x.k,x.t=='multi'?[...$('#f_'+x.k).selectedOptions].map(o=>o.value).join(','):$('#f_'+x.k).value.trim()]));

const qf=i=>{const s=i.nextElementSibling,t=i.value.trim().toLowerCase();[...s.options].forEach(o=>{o.hidden=!!t&&!o.selected&&o.value!==''&&!o.text.toLowerCase().includes(t)})};

const fin_=(sf)=>{const k=db;try{db=sf;const Z=TOT(FL({}));return{rev:Z.rev,cost:Z.cost,profit:Z.p,charged:sf.s.reduce((q,x)=>q+SS(x.id).tot,0),studentPaid:sf.s.reduce((q,x)=>q+SS(x.id).paid,0),studentRem:sf.s.reduce((q,x)=>q+SS(x.id).rem,0),teacherCost:sf.t.reduce((q,x)=>q+TS(x.id).cost,0),teacherPaid:sf.t.reduce((q,x)=>q+TS(x.id).paid,0),studentPayments:sum(sf.sp),teacherPayments:sum(sf.tp),projectPayments:sf.pp.reduce((q,p)=>q+p.amt,0)}}finally{db=k}};
const cnt_=d=>{const o={};ARRK.forEach(k=>o[k]=(d[k]||[]).length);o.cur=(d.cur||[]).length;o.rates=Object.keys(d.rates||{}).length;return o};
/* structural check of a whole dataset (used for backup files; the app's own start-up check is deliberately lenient so existing data is never refused) */
function dbCheck(d){const w=[],isO=x=>x&&typeof x=='object'&&!Array.isArray(x);
 if(!isO(d))return{err:'the data is not an object'};
 for(const k of ARRK){if(d[k]===undefined)return{err:'the list "'+k+'" is missing'};if(!Array.isArray(d[k]))return{err:'"'+k+'" is not a list'};if(d[k].some(r=>!isO(r)))return{err:'a record in "'+k+'" is not valid'}}
 if(!isO(d.set)||typeof d.set.base!='string'||!d.set.base)return{err:'the settings or base currency are missing'};
 if(!Array.isArray(d.cur))return{err:'the currency list is missing'};if(!isO(d.rates))return{err:'the saved exchange rates are missing'};if(!isO(d.rd))return{err:'the reminder history is missing'};
 if(typeof d.id!='number'||!isFinite(d.id))return{err:'the id counter is missing'};
 const need={l:['d','bcost','bchg'],sp:['amt','bamt'],tp:['amt','bamt'],pr:['rev','rx'],pp:['amt','pr'],rc:['price','n','rx'],re:['price','paid','rc','s']};
 for(const k in need)for(const r of d[k])for(const f of need[k])if(typeof r[f]!='number'||!isFinite(r[f]))return{err:'a record in "'+k+'" has a missing or non-numeric "'+f+'"'};
 let mx=0;for(const k of ARRK){const seen=new Set();for(const r of d[k]){if(typeof r.id!='number'||!isFinite(r.id))return{err:'a record in "'+k+'" has no numeric id'};if(seen.has(r.id))w.push('Duplicate id '+r.id+' in "'+k+'" (kept exactly as it is in the backup)');seen.add(r.id);mx=Math.max(mx,r.id)}}
 if(d.id<=mx)w.push('The id counter ('+d.id+') is not above the highest record id ('+mx+'); new records could reuse an id');
 const orph=d.l.filter(l=>!d.t.some(t=>t.id==l.t)||!d.s.some(s=>s.id==l.s)).length;if(orph)w.push(orph+' lesson(s) refer to a teacher or student that is not in the backup (kept as they are)');
 return{err:'',warns:w}}
function mkBackup(d){const o={format:BKFMT,formatVersion:1,app:'A+ Hub Academy',exportedAt:new Date().toISOString(),dataVersion:d.v,baseCurrency:d.set.base,settings:d.set,counts:cnt_(d),totals:fin_(d),checksum:hash(JSON.stringify(d)),data:d};return JSON.stringify(o)}
/* validates a backup file's text completely, without touching any stored data */
function chkBackup(text){const bad=err=>({ok:false,err});let o;
 if(typeof text!='string'||!text.trim())return bad('The file is empty.');
 try{o=JSON.parse(text)}catch(e){return bad('The file is not valid JSON, so it is not an A+ Hub backup (or it is damaged).')}
 if(!o||typeof o!='object'||o.format!==BKFMT)return bad('This is not an A+ Hub Academy full-data backup file.');
 if(o.formatVersion!==1)return bad('Unsupported backup format version ('+o.formatVersion+'). This app supports version 1.');
 if(!o.data||typeof o.data!='object')return bad('The backup contains no data.');
 if(o.data.v!==DATAV)return bad('Unsupported data version ('+o.data.v+'). This app supports version '+DATAV+'.');
 const c=dbCheck(o.data);if(c.err)return bad('The backup data is not valid: '+c.err+'.');
 if(hash(JSON.stringify(o.data))!==o.checksum)return bad('The checksum does not match: the file was changed or is damaged.');
 const cn=cnt_(o.data);if(!o.counts||JSON.stringify(cn)!==JSON.stringify(o.counts))return bad('The record counts in the file header do not match its data.');
 let f;try{f=fin_(o.data)}catch(e){return bad('Financial totals could not be calculated from this data ('+(e&&e.message||e)+').')}
 if(JSON.stringify(f)!==JSON.stringify(o.totals))return bad('The financial totals stored in the backup do not match its data.');
 return{ok:true,obj:o,warns:c.warns,counts:cn,totals:f}}
async function dlFile(fn,data,type){let dl=null;try{if(typeof claude!='undefined')dl=await claude.use('downloads')}catch(e){}
 const blob=new Blob([data],{type});if(dl){await dl.save({filename:fn,data:blob});return 'saved'}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return 'started'}
const fmtD=s=>{try{return new Date(s).toLocaleString()}catch(e){return s}};
async function doBackup(){if(LOCK)return note('There is no readable data to back up. Use the recovery options on this page.');
 let txt;try{txt=mkBackup(db)}catch(e){return note('The backup could not be created ('+E(e&&e.message||e)+'). Nothing was changed.')}
 const v=chkBackup(txt);
 const fn=`APlus-FullBackup-${stamp()}${v.ok?'':'-UNVERIFIED'}.json`;
 try{const r=await dlFile(fn,txt,'application/json');
  if(!v.ok){render();return note('<b class=neg>The file was saved but it did NOT pass its own check, so treat it as unverified.</b><br>'+E(v.err)+'<br>It holds your data as it is now, but Restore will refuse it. Keep it anyway and tell me about this message.')}try{localStorage.setItem('aplus_lastbackup',JSON.stringify({t:new Date().toISOString(),fn}))}catch(e){}
  note(`<b>Backup created and checked.</b> ${fn} — ${Object.entries(v.counts).filter(a=>a[1]).map(a=>a[1]+' '+a[0]).join(', ')}; checksum verified; financial totals match. ${r=='saved'?'The file was passed to the downloads service.':'The browser started the download.'} Check that the file is in your Downloads folder, and keep a copy somewhere other than this computer.`);render()}
 catch(e){note('The backup file could not be delivered ('+E(e&&e.message||e)+'). Try again.')}}
const storageOK=()=>{if(LOCK||!LASTGOOD)return false;try{localStorage.setItem('aplus',LASTGOOD);return localStorage.getItem('aplus')===LASTGOOD}catch(e){return false}};
function sbn(){let b=document.querySelector('#sbn');if(!b){b=document.createElement('div');b.id='sbn';document.body.appendChild(b)}
 if(SAVEBAD){b.innerHTML=`<b>Changes are NOT being saved.</b> ${E(SAVEBAD)} Your last saved data on this device is unchanged, and the change you just made was undone. Free up browser storage or allow site data, then repeat the change. <button class=b onclick="doBackup()">Download a backup now</button>`;b.style.display='block'}else b.style.display='none'}
function safetyKeys(){const k=[];try{for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(/^aplus_(safety|unreadable)_/.test(n))k.push(n)}}catch(e){}return k.sort().reverse()}
async function dlSafety(k){try{const t=localStorage.getItem(k);await dlFile(k+(k.startsWith('aplus_safety_')?'.json':'.txt'),t,'text/plain');note('The saved copy was passed to the downloads service. Check your Downloads folder.')}catch(e){note('Could not download it: '+E(e&&e.message||e))}}
function bkUI(){let lb='';try{lb=JSON.parse(localStorage.getItem('aplus_lastbackup')||'null')}catch(e){}
 const kb=Math.round(JSON.stringify(db).length/1024),sk=safetyKeys();
 return `<h3>Full Data Backup &amp; Restore</h3><div class=cd style="max-width:760px"><p>Your data lives only in this browser. A full backup is a single file with <b>everything</b>: all records, IDs, amounts, original currencies, saved exchange rates, dates, links between records and settings. Keep copies off this computer. This is separate from the Reports and Excel exports, which cannot be restored.</p>
<div class=bar><button class=b onclick="doBackup()">Download Full Data Backup</button><button class=b2 onclick="document.querySelector('#rf').click()">Restore from backup file…</button><input id=rf type=file accept=".json,application/json" style="display:none" onchange="pickRestore(this)"></div>
<p class=mut>${lb?'Last backup from this browser: '+E(fmtD(lb.t))+' ('+E(lb.fn)+')':'<b class=neg>No backup has been made from this browser yet.</b>'} · Data size about ${kb} KB (browsers usually allow about 5,000 KB).</p>
<p class=mut>Restore replaces the current data after you confirm. It first saves a copy of the current data in this browser and checks the result; if anything fails the current data is left as it was.</p>
${sk.length?'<p class=mut><b>Safety copies kept in this browser</b> (made automatically before a restore; the newest 3 are kept):</p>'+T(['Copy','Made','Size',''],sk.map(k=>{let sz=0;try{sz=Math.round(localStorage.getItem(k).length/1024)}catch(e){}return[E(k),E(fmtD(k.replace(/^aplus_(safety|unreadable)_/,'').replace(/^(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)$/,'$1-$2-$3T$4:$5:$6Z'))),sz+' KB',`<button class=lk onclick="dlSafety('${k}')">Download</button>`]})):''}</div>`}
async function pickRestore(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
 if(f.size>25e6)return note('That file is too large to be an A+ Hub backup. Nothing was changed.');
 let text;try{text=await f.text()}catch(e){return note('The file could not be read ('+E(e&&e.message||e)+'). Nothing was changed.')}
 const v=chkBackup(text);
 if(!v.ok)return modal(`<h3 style="margin-top:0">This file cannot be restored</h3><p class=neg>${E(v.err)}</p><p>Nothing was changed. Your current data is untouched.</p><div class=r><button class=b onclick=close()>Close</button></div>`);
 RESTORE=v;const cur=LOCK?{}:cnt_(db),bk=v.counts;
 modal(`<h3 style="margin-top:0">Restore this backup?</h3><p><b class=neg>Restoring REPLACES all current data in this browser</b> with the contents of this file. Records are never merged.</p>
<p class=mut>File: ${E(f.name)}<br>Made: ${E(fmtD(v.obj.exportedAt))} · base currency ${E(v.obj.baseCurrency)} · data version ${v.obj.dataVersion}<br>Checks passed: structure, checksum, record counts, financial totals.</p>
${T(['Records','In this browser now','In the backup'],Object.keys(bk).filter(k=>bk[k]||cur[k]).map(k=>[k,LOCK?'—':cur[k],bk[k]]))}
${v.warns.length?'<p class=neg><b>Notes about this backup:</b></p>'+v.warns.map(x=>'<p class=mut>• '+E(x)+'</p>').join(''):''}
<p>${LOCK?'The unreadable stored value will be kept as a separate saved copy first.':'A safety copy of your current data will be saved in this browser first.'} If anything fails, your current data stays as it is.</p>
<label><input type=checkbox id=rc_ok onchange="document.querySelector('#rc_go').disabled=!this.checked"> I understand that this replaces my current data.</label><div id=er></div>
<div class=r><button class=b2 onclick=close()>Cancel</button><button class="b bad" id=rc_go disabled onclick="applyRestore()">Replace current data with this backup</button></div>`)}
let RESTORE=null;
function applyRestore(){const v=RESTORE;if(!v||!v.ok)return;const btn=document.querySelector('#rc_go');if(btn){if(btn.dataset&&btn.dataset.busy)return;btn.disabled=true;btn.dataset.busy=1}
 const fail=m=>{RESTORE=null;modal(`<h3 style="margin-top:0">Restore did not complete</h3><p class=neg>${E(m)}</p><p><b>Your previous data is in place and unchanged.</b></p><div class=r><button class=b onclick=close()>Close</button></div>`)};
 let prev=null;try{prev=localStorage.getItem('aplus')}catch(e){return fail('Browser storage cannot be read ('+(e&&e.message||e)+').')}
 /* 1. safety copy of what is there now */
 const sk=(LOCK?'aplus_unreadable_':'aplus_safety_')+stamp();let copy=null;
 try{copy=LOCK?prev:mkBackup(db);if(copy!==null){if(!LOCK){const c=chkBackup(copy);if(!c.ok)throw new Error('the safety copy failed its own check: '+c.err)}
  localStorage.setItem(sk,copy);if(localStorage.getItem(sk)!==copy)throw new Error('the safety copy could not be verified')}}
 catch(e){try{localStorage.removeItem(sk)}catch(x){}return fail('The safety copy of the current data could not be saved ('+(e&&e.message||e)+'), so nothing was replaced.')}
 /* 2. write the backup data and verify what the browser really holds */
 const ns=JSON.stringify(v.obj.data);let err='';
 try{localStorage.setItem('aplus',ns);const back=localStorage.getItem('aplus');if(back!==ns)throw new Error('the browser did not keep exactly what was written');
  const p=JSON.parse(back),c=dbCheck(p);if(c.err)throw new Error(c.err);if(JSON.stringify(cnt_(p))!==JSON.stringify(v.counts))throw new Error('record counts differ after restore');
  if(JSON.stringify(fin_(p))!==JSON.stringify(v.totals))throw new Error('financial totals differ after restore');
  /* 3. only now switch the running app over */
  db=p;LOCK='';SAVEBAD='';LASTGOOD=ns;RESTORE=null}
 catch(e){err=e&&e.message||String(e)}
 if(err){let rb='';try{if(prev===null)localStorage.removeItem('aplus');else{localStorage.setItem('aplus',prev);if(localStorage.getItem('aplus')!==prev)rb=' WARNING: the original value could not be re-verified; use the safety copy "'+sk+'".'}}catch(e){rb=' WARNING: the original value could not be put back; use the safety copy "'+sk+'" in Settings.'}
  return fail('Validation failed: '+err+'.'+rb)}
 const ks=safetyKeys();ks.slice(3).forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
 sbn();V.nav='Settings';V.tid=V.sid=V.prid=V.rcid=null;render();
 modal(`<h3 style="margin-top:0">Restore completed and checked</h3><p>The data was written, read back from the browser and compared with the backup: record counts and financial totals match (student charges ${f(v.totals.charged)}, student payments ${f(v.totals.studentPayments)}, teacher payments ${f(v.totals.teacherPayments)}, profit ${f(v.totals.profit)}).</p><p class=mut>A safety copy of the previous data is kept in Settings as ${E(sk)}.</p><div class=r><button class=b onclick=close()>OK</button></div>`)}
function recoveryPage(){let raw=null;try{raw=localStorage.getItem('aplus')}catch(e){}
 return `<h2 class=neg>Your saved data could not be loaded</h2><div class=cd style="max-width:760px"><p><b>${E(LOCK)}</b></p><p><b>Nothing has been changed or deleted.</b> The app has not saved anything this session, and it will not replace your stored data with an empty database. Saving is switched off until this is resolved.</p>
<p><b>What to do</b></p><ol><li>${raw!==null?'Download the unreadable stored data below and keep it. It can sometimes be repaired by hand.':'Check that this site is allowed to store data in the browser (not a private window, site data not blocked).'}</li><li>Close other tabs of this app, then press Retry.</li><li>If it still fails, restore your latest Full Data Backup file.</li></ol>
<div class=bar><button class=b onclick="location.reload()">Retry loading</button><button class=b2 onclick="document.querySelector('#rf').click()">Restore from backup file…</button>${raw!==null?'<button class=b2 onclick="dlRaw()">Download the unreadable stored data</button>':''}<input id=rf type=file accept=".json,application/json" style="display:none" onchange="pickRestore(this)"></div>
<p class=mut>Restoring first keeps the unreadable value as a separate saved copy, then replaces it only if the backup passes every check.</p></div>`}
async function dlRaw(){try{const t=localStorage.getItem('aplus');await dlFile('APlus-unreadable-data-'+stamp()+'.txt',t,'text/plain');note('The stored data was passed to the downloads service. Check your Downloads folder.')}catch(e){note('Could not download it: '+E(e&&e.message||e))}}
/* ---- settings & exchange rates ---- */
function setBase(v){if(v==B())return;ask(`Change the Academy Base Currency to ${v}? Existing records keep their original amounts, currencies, rates and base amounts. The saved exchange-rate table is cleared and must be refreshed or entered again.`,()=>{db.set.base=v;db.rates={};db.rst='';save();render()},'Change')}
function setMR(c){const v=parseFloat($('#mr_'+c).value);if(v>0){db.rates[c]={r:v,t:new Date().toISOString(),type:'Manual'};save();render()}}
async function refreshRates(){const b=B();db.rst='Updating…';render();
try{const r=await fetch('https://open.er-api.com/v6/latest/'+b);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.result!=='success')throw new Error('API error');
let n=0;db.cur.forEach(c=>{const v=j.rates&&j.rates[c.c];if(c.c!=b&&v>0){db.rates[c.c]={r:1/v,t:new Date().toISOString(),type:'Live'};n++}});db.rst='Updated '+new Date().toLocaleString()+' ('+n+' rates)'}
catch(e){db.rst='Live rates unavailable ('+(e.message||'request blocked')+'). Enter rates manually.'}save();render()}
function addCur(){form('Add Currency',[{k:'c',l:'Currency code (e.g. GBP)',r:1},{k:'n',l:'Name',r:1}],{},o=>{const c=o.c.toUpperCase();if(!/^[A-Z]{3}$/.test(c))return 'Use a 3-letter code';if(db.cur.some(x=>x.c==c))return 'Already in the list';db.cur.push({c,n:o.n})})}
function vSet(){const s=db.set;return `<h2>Settings</h2><div class=cd style="max-width:520px"><div class=fg><label class=w>Academy name<input id=s_name value="${E(s.name)}"></label><label>Academy Base Currency<select onchange="setBase(this.value)">${curO().map(o=>`<option value="${o[0]}" ${o[0]==B()?'selected':''}>${o[1]}</option>`).join('')}</select></label><label>&nbsp;</label><label>Default teacher rate/hr<input id=s_tr type=number step=any min=0 value="${E(s.tr)}"></label><label>Default student rate/hr<input id=s_sr type=number step=any min=0 value="${E(s.sr)}"></label></div><p class=mut>Defaults only pre-fill new lessons; rates can always be changed per lesson. Data is stored in this browser.</p><div class=r><button class=b onclick="Object.assign(db.set,{name:$('#s_name').value||'A+ Hub Academy',tr:$('#s_tr').value,sr:$('#s_sr').value});save();render()">Save settings</button></div></div>
${bkUI()}
<h3>Exchange Rates <span class=mut>(1 unit of currency = X ${B()})</span></h3><div class=bar><button class=b onclick=refreshRates()>Refresh live rates</button><button class=b2 onclick=addCur()>+ Add currency</button><span class=mut>${E(db.rst||'Rates have not been loaded.')}</span></div>
<p class=mut>Rates are never invented: if a rate is unavailable, enter it manually. Each transaction stores the rate used when it was recorded, so changing rates later never alters old records.</p>`+T(['Currency','Current Rate','Last Updated','Status','Manual rate'],db.cur.map(c=>{const r=c.c==B()?null:db.rates[c.c];return[c.c+' — '+E(c.n),c.c==B()?'1 (base)':r?(+r.r).toFixed(6):'<span class=neg>Unavailable</span>',r?new Date(r.t).toLocaleString():'—',c.c==B()?'Base':r?r.type:'No rate',c.c==B()?'':`<input id=mr_${c.c} type=number step=any min=0 style="width:110px" placeholder="rate"><button class=lk onclick="setMR('${c.c}')">Set</button>`]}))}
/* ---- shell ---- */
const NAV=['Dashboard','Timetable','Teachers','Students','Subjects','Lessons','Projects','Recorded Courses','Payments','Reports','Cash Flow','Settings'],VW={Dashboard:vDash,Timetable:vTT,Teachers:vTeachers,Students:vStudents,Subjects:vSubj,Lessons:vLessons,Projects:vPR,'Recorded Courses':vRC,Payments:vPay,Reports:vRep,'Cash Flow':vCF,Settings:vSet};
function render(){if(LOCK){$('#nv').innerHTML=`<h1>A+ Hub Academy</h1><small>Recovery mode</small>`;$('#v').innerHTML=recoveryPage();return}const a=document.activeElement?.id,pos=document.activeElement?.selectionStart;CH.forEach(c=>c.destroy());CH=[];
$('#nv').innerHTML=`<h1>${E(db.set.name)}</h1><small>Management System</small>`+NAV.map(n=>`<a class="${V.nav==n?'on':''}" onclick="V.nav='${n}';V.tid=V.sid=V.prid=V.rcid=null;render()">${n}</a>`).join('');
$('#v').innerHTML=VW[V.nav]();if(a&&$('#'+a)&&!$('#m').innerHTML){try{const e=$('#'+a);e.focus();e.setSelectionRange(pos,pos)}catch(x){}}}
try{Chart.defaults.color=getComputedStyle(document.documentElement).getPropertyValue('--ink')||'#12305a'}catch(e){}
save();render();sbn();
if(!LOCK&&!Object.keys(db.rates).length)refreshRates();
</script></body></html>
