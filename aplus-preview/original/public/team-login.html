<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A+ Hub · Team sign in</title><style>body{margin:0;background:#101e33;color:#edf4ff;font:16px system-ui;display:grid;min-height:100vh;place-items:center}.card{background:#1b304d;border:1px solid #395477;border-radius:18px;padding:32px;width:min(420px,85vw)}h1{margin-top:0}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #6882a5;background:#102139;color:white;font:inherit}button{background:#82b8f3;color:#102139;font-weight:700;cursor:pointer}small{color:#c0d2e7}#error{color:#ffb8b8;white-space:pre-wrap}#setup{display:none}</style></head><body><main class="card"><h1>A+ Hub</h1><h2 id="heading">Team sign in</h2><p id="context">Your account controls which academy records you can access.</p><form id="login"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><div id="setup"><label>Administrator display name<input id="display"></label><label>Setup code from the server console<input id="code" autocomplete="off"></label><small>Choose your own administrator password, with at least 12 characters. No default production password exists.</small></div><p id="error" role="alert"></p><button id="submit">Sign in</button></form></main><script src="/team-login.js"></script><div id="review-banner" dir="rtl" style="position:fixed;bottom:8px;left:8px;z-index:99999;background:#fef3c7;color:#713f12;border:1px solid #d97706;border-radius:8px;padding:8px 12px;font:14px system-ui;pointer-events:none">نسخة تجربة — 3005 — التعديلات هنا لا تصل لنسخة الشغل على 3000</div></body></html>
