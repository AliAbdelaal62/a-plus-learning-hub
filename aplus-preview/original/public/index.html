ervices whose student charge and teacher cost are in different currencies are left out of Profit (their profit exists only in the converted view) but their revenue and cost are shown here so nothing is hidden.","لكل صف: الإيراد − التكلفة = الربح + (إيراد العملات المختلفة − تكلفتها). الخدمات التي تختلف فيها عملة الطالب عن المدرس لا تُضاف لربح نفس العملة؛ يظهر ربحها في العرض المحول، وتظل إيراداتها وتكاليفها ظاهرة هنا."],["The charts and cards below combine currencies using the rate saved on each record (converted view).","الرسوم والمؤشرات التالية تجمع العملات باستخدام سعر الصرف المحفوظ بكل سجل (العرض المحول)."],["+ Follow-up task","+ مهمة متابعة"],["+ Service registration","+ تسجيل خدمة"],["Record attendance / lesson notes","تسجيل الحضور / ملاحظات الحصة"],["Open timetable","فتح جدول المواعيد"],["Tasks due today or overdue","مهام اليوم والمهام المتأخرة"],["No tasks in this selection.","لا توجد مهام ضمن الاختيارات."],["Today’s scheduled sessions","المواعيد المجدولة اليوم"],["Today’s lesson records","سجلات حصص اليوم"],["No lesson records dated today. Scheduled sessions appear above until recorded in Lessons.","لا توجد حصص مسجلة بتاريخ اليوم. تظل المواعيد بالأعلى حتى تسجيلها في الحصص."],["Unexcused absences · last 7 days","غياب دون عذر · آخر ٧ أيام"],["No recorded unexcused absences in the last 7 days.","لا يوجد غياب دون عذر مسجل خلال آخر ٧ أيام."],["Record an outcome when you complete a follow-up. Full SQLite backups include registrations, attendance, lesson notes and tasks. The administrative JSON export is a reference copy; use verified database backups for recovery.","سجل نتيجة المتابعة عند إتمامها. النسخ الكاملة لقاعدة SQLite تشمل التسجيلات والحضور وملاحظات الحصص والمهام. التصدير الإداري JSON نسخة مرجعية؛ استخدم النسخ المتحققة لقاعدة البيانات للاستعادة."],["Completed sessions (history)","المواعيد المكتملة (السجل)"],["Bookings and confirmations","الحجوزات والتأكيدات"],["Weekly availability","أوقات التوافر الأسبوعية"],["Waiting list","قائمة الانتظار"],["No managed bookings yet. Existing timetable records remain on Timetable.","لا توجد حجوزات جديدة بعد. المواعيد القديمة ما زالت في جدول المواعيد."],["No availability recorded. Add a window before creating a booking.","لم تُسجل أوقات توافر. أضف فترة توافر قبل إنشاء الحجز."],["No waiting-list requests.","لا توجد طلبات في قائمة الانتظار."],["Bookings are checked against teacher availability, the existing timetable, other bookings and timed completed lessons. Booking a slot creates no charge. Changes to date, time, student or teacher clear recorded confirmations.","يفحص الحجز أوقات توافر المدرس والجدول والحجوزات الأخرى والحصص المنفذة ذات التوقيت. الحجز لا ينشئ رسومًا. تغيير التاريخ أو التوقيت أو الطالب أو المدرس يلغي التأكيدات المسجلة."],["One list for Live subjects, Recorded Courses and Projects. Recorded courses and projects are also managed in their own pages; they are the same records.","قائمة موحدة للمواد المباشرة والكورسات المسجلة والمشاريع. إدارة الكورسات والمشاريع من صفحاتها تستخدم نفس السجلات دون تكرار."],["Course Cost","تكلفة الكورس"],["Reminders (e.g. Send Recorded Lectures)","التذكيرات (مثل إرسال المحاضرات المسجلة)"],["What reminders do:","وظيفة التذكيرات:"],["a reminder appears on this screen while A+ Hub is open in your browser (checked about once a minute, using the Africa/Cairo time and date). Nothing is sent by e-mail, SMS or phone notification, and nothing is delivered while the app or the computer is closed; a reminder that came due within the last 7 days while the app was closed is shown once when you next open it. For alerts outside the app, import the calendar file","يظهر التذكير أثناء فتح النظام في المتصفح، ويُفحص تقريبًا كل دقيقة بتوقيت القاهرة. لا تُرسل رسائل بريد أو SMS أو إشعارات هاتف، ولا يعمل أثناء إغلاق التطبيق أو الجهاز. يظهر التذكير المستحق خلال آخر ٧ أيام عند فتح النظام. للتنبيه خارج النظام، استورد ملف التقويم"],["into your own calendar application.","إلى تطبيق التقويم الخاص بك."],["Days","الأيام"],["Repeat","التكرار"],["Coming up (next 30 days)","القادم (خلال ٣٠ يومًا)"],["Nothing due in the next 30 days.","لا توجد استحقاقات خلال ٣٠ يومًا."],["Original currencies (default)","العملات الأصلية (الافتراضي)"],["never added together","لا تُجمع معًا أبدًا"],["A. Work by original currency (revenue, cost, profit - never combined across currencies)","أ. الأعمال بالعملة الأصلية (الإيراد والتكلفة والربح — دون جمع العملات المختلفة)"],["Live Revenue","إيراد الحصص المباشرة"],["Live Teacher Cost","أجور مدرس الحصص المباشرة"],["Live Profit - lessons billed and paid in the same currency","ربح الحصص المحصلة والمدفوعة بنفس العملة"],["Mixed-currency Lessons: Revenue, not in profit","حصص بعملات مختلفة: إيراد لا يدخل في ربح نفس العملة"],["Mixed-currency Lessons: Teacher Cost, not in profit","حصص بعملات مختلفة: تكلفة مدرس لا تدخل في ربح نفس العملة"],["Project Revenue","إيراد المشاريع"],["Project Teacher Share","نسبة مدرس المشاريع"],["Course Revenue","إيراد الكورسات"],["Course Share","نسبة مدرس الكورسات"],["Course Profit","ربح الكورسات"],["B. Cash by original currency (dated receipts and payments; opening balances shown separately). With a Work Type filter only the allocated part of a student receipt and teacher payments with a recorded source are counted; unallocated receipts and unassigned payments have no work type and are excluded, never given an invented one. Refunds carry no method or work type and are excluded when either filter is set","ب. النقدية بالعملة الأصلية (المقبوضات والمدفوعات المؤرخة، والافتتاحي منفصل). عند فلترة نوع العمل تُحسب الأجزاء المخصصة من دفعات الطلاب ودفعات المدرسين ذات المصدر المسجل فقط. غير الموزع يُستبعد دون تخمين مصدر. المبالغ المستردة لا تحمل طريقة أو نوع عمل وتُستبعد عند استخدام أي منهما."],["Student Payments in Period","دفعات الطلاب خلال الفترة"],["Project Payments in Period","دفعات المشاريع خلال الفترة"],["Total Dated Receipts","إجمالي المقبوضات المؤرخة"],["Teacher Payments in Period","دفعات المدرسين خلال الفترة"],["Net Dated Cash","صافي النقدية المؤرخة"],["NOT DATED CASH - Project Opening Paid","مبلغ غير مؤرخ — مدفوع افتتاحي للمشاريع"],["NOT DATED CASH - Course Enrolment Paid, running total","مبلغ غير مؤرخ — إجمالي مدفوع تسجيل الكورسات"],["C. Teachers by currency","ج. المدرسون حسب العملة"],["Earned in Period","المستحق خلال الفترة"],["Paid in Period","المدفوع خلال الفترة"],["Balance All-Time, same currency","رصيد كل الفترات بنفس العملة"],["D. Students by currency","د. الطلاب حسب العملة"],["Charges in Period","رسوم الفترة"],["Dated Payments in Period","الدفعات المؤرخة خلال الفترة"],["D. Lesson Report (Live)","د. تقرير الحصص المباشرة"],["Subject Type","نوع المادة"],["Work Type","نوع العمل"],["Student Charge","رسوم الطالب"],["Teacher Exchange Rate","سعر صرف المدرس"],["Student Exchange Rate","سعر صرف الطالب"],["Rate Type","نوع سعر الصرف"],["Base Currency","العملة الأساسية"],["Start Time","وقت البداية"],["End Time","وقت النهاية"],["Project Report","تقرير المشاريع"],["Recorded Course Report","تقرير الكورسات المسجلة"],["All-Work Ledger (original + converted)","سجل كل الأعمال (الأصلي + المحول)"],["Original Currency","العملة الأصلية"],["Original Amount","المبلغ الأصلي"],["Exchange Rate","سعر الصرف"],["Converted Amount","المبلغ المحول"],["Payment","الدفعة"],["Source Detail","تفاصيل المصدر"],["Work-type applicability","ارتباط نوع العمل"],["Timetable in period","المواعيد خلال الفترة"],["Schedule","الجدول"],["Payments in period (with a student filter: that student's receipts and the teacher payments linked to that student's lessons only; with a work-type filter, receipts without an allocation and payments without a source are listed and labelled)","دفعات الفترة (عند فلترة طالب: مقبوضاته ودفعات المدرس المرتبطة بحصصه فقط. عند فلترة نوع العمل، تُعرض الدفعات غير الموزعة أو دون مصدر مع توضيح حالتها)."],["kept in the currency it was paid in","تظل بالعملة التي دُفعت بها"],["Month","الشهر"],["Export to Excel (.xlsx)","تصدير إلى Excel (.xlsx)"],["Cash movement by currency","حركة النقدية حسب العملة"],["Received from students","المقبوض من الطلاب"],["Paid to teachers","المدفوع للمدرسين"],["Net movement (before other expenses)","صافي الحركة (قبل المصروفات الأخرى)"],["1. Cash received from students","١. المقبوضات من الطلاب"],["By work type","حسب نوع العمل"],["None in this month.","لا توجد عمليات هذا الشهر."],["By payment method","حسب طريقة الدفع"],["Transactions","الحركات"],["No student payments in this month.","لا توجد دفعات طلاب هذا الشهر."],["2. Payments made to teachers","٢. المدفوعات للمدرسين"],["By payment source","حسب مصدر الدفعة"],["By teacher","حسب المدرس"],["Related service","الخدمة المرتبطة"],["3. Net cash movement","٣. صافي حركة النقدية"],["Student receipts","مقبوضات الطلاب"],["Teacher payments","دفعات المدرسين"],["Net before other expenses","الصافي قبل المصروفات الأخرى"],["4. Opening and closing cash balance","٤. رصيد النقدية الافتتاحي والختامي"],["Cash, bank accounts and wallets are not tracked in this system, so an opening balance, other cash movements and an actual closing balance cannot be determined.","هذا التقرير القديم لا يتتبع أرصدة الخزائن والبنوك والمحافظ؛ لذلك لا يحدد افتتاحيًا أو ختاميًا فعليًا أو حركات نقدية أخرى."],["Charges minus payments","الرسوم ناقص المدفوعات"],[". A negative figure means the student has paid more than was charged in that currency (credit).",". الرقم السالب يعني أن الطالب دفع أكثر من الرسوم بنفس العملة (رصيد دائن)."],["Paid (incl. undated opening paid)","المدفوع (يشمل الافتتاحي غير المؤرخ)"],["of which undated opening paid","منه مدفوع افتتاحي غير مؤرخ"],["of which Unassigned source","منه مصدر غير موزع"],["Measure","المؤشر"],["Difference","الفرق"],["Change","التغير"],["8. Data checks","٨. فحوص البيانات"],["• Other academy expenses and other cash movements are not recorded in this system, so they are not included. Net cash movement is receipts minus teacher payments only, per currency.","• المصروفات الأخرى والحركات الأخرى لا تدخل في هذا التقرير القديم. صافي الحركة هنا هو المقبوضات ناقص دفعات المدرسين لكل عملة."],["• Cash, bank or wallet balances are not tracked, so an opening or closing cash balance cannot be determined.","• هذا التقرير لا يتتبع أرصدة الخزائن والبنوك والمحافظ؛ لذلك لا يحدد افتتاحيًا أو ختاميًا فعليًا."],["• Ageing of outstanding balances needs one currency to allocate payments across charges, so it is only available in the converted view.","• تحليل أعمار الديون يحتاج عملة واحدة لتوزيع الدفعات على الرسوم، وهو متاح في العرض المحول فقط."],["Live packages are charged as lessons are delivered, using the agreed package price split across sessions. Collection in advance appears as student credit until delivery. Project/course agreements refer to their existing charges. No agreement creates a duplicate charge or payment.","تُحتسب رسوم الباقات عند تنفيذ الحصص بتوزيع السعر المتفق عليه عليها. التحصيل المسبق يظهر كرصيد دائن للطالب حتى التنفيذ. اتفاقات المشاريع والكورسات تشير لرسومها الحالية ولا تنشئ رسومًا أو دفعات مكررة."],["Issued receipts","الإيصالات الصادرة"],["No receipts issued through agreements yet.","لم تصدر إيصالات من الاتفاقات بعد."],["Administrative follow-up only. These records do not create charges, payments or change teacher earnings. Existing lessons have no attendance or summary until you record one.","للمتابعة الإدارية فقط. هذه السجلات لا تنشئ رسومًا أو دفعات ولا تغير مستحقات المدرس. لا يُفترض حضور أو ملخص للحصص القديمة قبل تسجيله."],["No matching registrations. Add registrations as new agreements are made; historical agreements are not guessed.","لا توجد تسجيلات مطابقة. أضف التسجيل عند الاتفاق الجديد؛ لا تُخمن الاتفاقات القديمة."],["Attendance describes the student’s participation. It does not change the lesson’s financial status. To record a scheduled session first, use Timetable → DONE.","الحضور يصف مشاركة الطالب ولا يغير الحالة المالية للحصة. لتسجيل موعد مجدول أولًا، استخدم جدول المواعيد ← تم التنفيذ."],["No lessons in this selection. Choose another date or view all lessons.","لا توجد حصص ضمن الاختيارات. اختر تاريخًا آخر أو اعرض كل الحصص."],["Every follow-up has a responsible person, a due date and an outcome. No message is sent automatically.","لكل متابعة مسؤول وتاريخ استحقاق ونتيجة. لا تُرسل رسائل تلقائيًا."],["Track deliverables, revision requests and materials sent. A Sent record does not prove viewing or understanding; no message is sent automatically. Links open externally only when you choose them.","تابع التسليمات وطلبات التعديل والمواد المرسلة. حالة تم الإرسال لا تعني المشاهدة أو الفهم، ولا تُرسل رسالة تلقائيًا. الروابط الخارجية تُفتح عند اختيارها فقط."],["Project milestones","مراحل المشاريع"],["No project milestones yet.","لا توجد مراحل مشاريع بعد."],["Revision requests","طلبات التعديل"],["No revision requests.","لا توجد طلبات تعديل."],["Recorded-course materials","مواد الكورسات المسجلة"],["No recorded-course deliveries planned.","لا توجد تسليمات كورسات مسجلة مخططة."],["Admin: full management. Coordinator: scheduling, registrations and delivery, without financial access. Accountant: collection and financial records, without team administration. Teacher: their own students, lessons, availability and deliveries. Role changes and disabling an account end its sessions. Only administration approves project delivery.","المدير: إدارة كاملة. المنسق: الجدولة والتسجيلات والتسليم دون وصول مالي. المحاسب: التحصيل والسجلات المالية دون إدارة الفريق. المدرس: طلابه وحصصه وتوافره وتسليماته فقط. تغيير الصلاحية أو تعطيل الحساب ينهي جلساته. الإدارة وحدها تعتمد تسليم المشروع."],["Defaults only pre-fill new lessons; rates can always be changed per lesson. Data is stored in the local A+ Hub database on this computer.","الإعدادات الافتراضية تملأ الحصص الجديدة فقط، ويمكن تغيير أسعار كل حصة. البيانات محفوظة في قاعدة النظام المحلية على هذا الجهاز."],["SQLite backups include registrations, attendance, lesson summaries and follow-up tasks. The older financial JSON export does not include those records; administrative JSON is a reference export, not a database restore. Restore first makes a safety backup of the current data, verifies the chosen backup, and rolls everything back if a step fails.","نسخ SQLite تشمل التسجيلات والحضور وملخصات الحصص ومهام المتابعة. التصدير المالي JSON القديم لا يشملها، والتصدير الإداري مرجع وليس نسخة استعادة. الاستعادة تنشئ نسخة أمان أولًا وتتحقق من النسخة المختارة وتتراجع بالكامل عند فشل أي خطوة."],["Rates are never invented: if a rate is unavailable, enter it manually. Each transaction stores the rate used when it was recorded, so changing rates later never alters old records.","لا يُخمن سعر الصرف: أدخله يدويًا إن لم يتوفر. تحتفظ كل عملية بسعرها عند التسجيل؛ تغيير الأسعار لاحقًا لا يغير السجلات القديمة."],["+ Add currency","+ إضافة عملة"],["Current Rate","سعر الصرف الحالي"],["Last Updated","آخر تحديث"],["Manual rate","سعر يدوي"],["Set","تعيين"],["The same all-time totals and category calculations as the existing administration Financial Summary. Only its EGP columns are exposed here. This display conversion does not change recorded payments or create a currency settlement.","نفس إجماليات كل الفترات وطريقة حساب الفئات في ملخص الإدارة. المعروض هنا أعمدة الجنيه المصري فقط، والتحويل للعرض لا يغير دفعات ولا ينشئ تسوية عملة."],["Net profit after operating expenses","صافي الربح بعد المصروفات التشغيلية"],["Service profit before expenses","ربح الخدمات قبل المصروفات"],["Recorded operating expenses","المصروفات المسجلة"],["Net profit","صافي الربح"],["All-time totals under the existing service accounting rules. Each expense is counted once when recorded, whether paid or not. Other profit figures on this page are before operating expenses. Opening balances and internal transfers are not revenue.","إجماليات كل الفترات وفق قواعد احتساب الخدمات الحالية. المصروف يُحتسب مرة واحدة عند تسجيله، سواء سُدد أم لا. أرقام الأرباح الأخرى في الصفحة قبل المصروفات التشغيلية. الأرصدة الافتتاحية والتحويلات الداخلية لا تُعد إيرادًا."],["Expenses, accounts & reconciliation","المصروفات والخزائن والمطابقة"],["Batch Payments — student hours","Batch Payments — دفعة مجمّعة لساعات طالب"],["Select teacher, student and period. Payment uses saved completed-lesson costs, not the current hourly rate.
